<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <main class="task border w-96 mx-auto rounded-lg shadow mt-10">
    <section class="p-4 flex flex-col">
      <h1 class="text-xl font-bold text-center text-gray-600 mb-4">
        Lista de tareas
      </h1>

      <label class="flex flex-col gap-1 mb-2">
        Ingresa una tarea
        <input
          class="task__input border border-gray-300 text-sm rounded-lg p-2 w-full"
          type="text"
          placeholder="Ej. Aprender Javascript"
        >
      </label>

      <div>
        <button>
          Limpiar tareas completados
        </button>
      </div>

      <ul>
        <li>
          <input
            type="checkbox"
          >
          <div>
            Tarea 1
          </div>
          <button>
            Borrar
          </button>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
